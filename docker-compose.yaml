#
# Migration demo: all-in-Docker, TLS + SNI everywhere between clients and proxies.
#
# Services:
#   kafka-source       Source Kafka cluster (KRaft, single node, plaintext on internal network)
#   kafka-dest         Destination Kafka cluster (KRaft, single node, plaintext on internal network)
#   producer-proxy     Kroxylicious sidecar for the producer (TLS, SNI-routed)
#   consumer-proxy     Kroxylicious sidecar for the consumer (TLS, SNI-routed)
#   init-topics        One-shot: creates the 'orders' topic on both clusters
#   producer           Java producer connecting to producer-proxy via TLS
#   consumer           Java consumer connecting to consumer-proxy via TLS
#

services:

  # ---------- Kafka clusters ----------

  kafka-source:
    image: docker.io/apache/kafka:4.1.1
    container_name: kafka-source
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-source:9094
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-source:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_KRAFT_CLUSTER_ID: Qh9gAAIfRl6r7xTQxVBdRA
      KAFKA_NODE_ID: 1
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 15

  kafka-dest:
    image: docker.io/apache/kafka:4.1.1
    container_name: kafka-dest
    environment:
      KAFKA_ENABLE_KRAFT: "yes"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-dest:9094
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-dest:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_KRAFT_CLUSTER_ID: XkosmjQFQAqegYUNJG4WjQ
      KAFKA_NODE_ID: 1
    healthcheck:
      test: /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list > /dev/null 2>&1
      interval: 5s
      timeout: 10s
      retries: 15

  # ---------- Topic initialisation ----------

  init-topics:
    image: docker.io/apache/kafka:4.1.1
    container_name: init-topics
    depends_on:
      kafka-source: { condition: service_healthy }
      kafka-dest:   { condition: service_healthy }
    restart: "no"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-source:9092 \
          --create --if-not-exists --topic orders --partitions 3 --replication-factor 1
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka-dest:9092 \
          --create --if-not-exists --topic orders --partitions 3 --replication-factor 1
        echo "Topics created on both clusters."

  # ---------- Kroxylicious sidecars ----------
  # Each proxy serves both source-cluster and dest-cluster on a single TLS port,
  # routed by SNI hostname. Network aliases give the container the SNI hostnames
  # the clients will resolve.

  producer-proxy:
    image: quay.io/kroxylicious/kroxylicious:0.19.0
    container_name: producer-proxy
    depends_on:
      kafka-source: { condition: service_healthy }
      kafka-dest:   { condition: service_healthy }
    volumes:
      - ./producer-proxy-config.yaml:/opt/kroxylicious/config/config.yaml:ro
      - ./certs/generated:/opt/kroxylicious/certs:ro
    command: --config /opt/kroxylicious/config/config.yaml
    networks:
      default:
        aliases:
          - source.producer-proxy
          - dest.producer-proxy
          - broker-1.source.producer-proxy
          - broker-1.dest.producer-proxy

  consumer-proxy:
    image: quay.io/kroxylicious/kroxylicious:0.19.0
    container_name: consumer-proxy
    depends_on:
      kafka-source: { condition: service_healthy }
      kafka-dest:   { condition: service_healthy }
    volumes:
      - ./consumer-proxy-config.yaml:/opt/kroxylicious/config/config.yaml:ro
      - ./certs/generated:/opt/kroxylicious/certs:ro
    command: --config /opt/kroxylicious/config/config.yaml
    networks:
      default:
        aliases:
          - source.consumer-proxy
          - dest.consumer-proxy
          - broker-1.source.consumer-proxy
          - broker-1.dest.consumer-proxy

  # ---------- Workloads ----------

  producer:
    build:
      context: ./clients
    container_name: demo-producer
    depends_on:
      init-topics:    { condition: service_completed_successfully }
      producer-proxy: { condition: service_started }
    environment:
      MAIN_CLASS: com.example.kafkamigration.Producer
      BOOTSTRAP: "${PRODUCER_BOOTSTRAP:-source.producer-proxy:9192}"
      TOPIC: orders
      TRUSTSTORE_LOCATION: /certs/truststore.p12
      TRUSTSTORE_PASSWORD: changeit
    volumes:
      - ./certs/generated:/certs:ro

  consumer:
    build:
      context: ./clients
    container_name: demo-consumer
    depends_on:
      init-topics:    { condition: service_completed_successfully }
      consumer-proxy: { condition: service_started }
    environment:
      MAIN_CLASS: com.example.kafkamigration.Consumer
      BOOTSTRAP: "${CONSUMER_BOOTSTRAP:-source.consumer-proxy:9292}"
      TOPIC: orders
      GROUP_ID: demo-consumer
      TRUSTSTORE_LOCATION: /certs/truststore.p12
      TRUSTSTORE_PASSWORD: changeit
    volumes:
      - ./certs/generated:/certs:ro
