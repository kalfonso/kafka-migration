#
# Producer sidecar: two virtual clusters exposing source and dest Kafka clusters.
# Both gateways share TCP port 9192; routing is done by SNI hostname.
#   source.producer-proxy:9192 -> kafka-source:9092
#   dest.producer-proxy:9192   -> kafka-dest:9092
#
---
virtualClusters:
  - name: source-cluster
    targetCluster:
      bootstrapServers: kafka-source:9092
    gateways:
      - name: default
        sniHostIdentifiesNode:
          bootstrapAddress: source.producer-proxy:9192
          advertisedBrokerAddressPattern: broker-$(nodeId).source.producer-proxy:9192
        tls:
          key:
            storeFile: /opt/kroxylicious/certs/keystore.p12
            storePassword:
              password: changeit
            storeType: PKCS12
    logNetwork: false
    logFrames: false
  - name: dest-cluster
    targetCluster:
      bootstrapServers: kafka-dest:9092
    gateways:
      - name: default
        sniHostIdentifiesNode:
          bootstrapAddress: dest.producer-proxy:9192
          advertisedBrokerAddressPattern: broker-$(nodeId).dest.producer-proxy:9192
        tls:
          key:
            storeFile: /opt/kroxylicious/certs/keystore.p12
            storePassword:
              password: changeit
            storeType: PKCS12
    logNetwork: false
    logFrames: false
