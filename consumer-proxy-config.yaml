#
# Consumer sidecar: two virtual clusters exposing source and dest Kafka clusters.
# Both gateways share TCP port 9292; routing is done by SNI hostname.
#   source.consumer-proxy:9292 -> kafka-source:9092
#   dest.consumer-proxy:9292   -> kafka-dest:9092
#
---
virtualClusters:
  - name: source-cluster
    targetCluster:
      bootstrapServers: kafka-source:9092
    gateways:
      - name: default
        sniHostIdentifiesNode:
          bootstrapAddress: source.consumer-proxy:9292
          advertisedBrokerAddressPattern: broker-$(nodeId).source.consumer-proxy:9292
        tls:
          key:
            storeFile: /opt/kroxylicious/certs/keystore.p12
            storePassword:
              password: changeit
            storeType: PKCS12
    logNetwork: false
    logFrames: false
  - name: dest-cluster
    targetCluster:
      bootstrapServers: kafka-dest:9092
    gateways:
      - name: default
        sniHostIdentifiesNode:
          bootstrapAddress: dest.consumer-proxy:9292
          advertisedBrokerAddressPattern: broker-$(nodeId).dest.consumer-proxy:9292
        tls:
          key:
            storeFile: /opt/kroxylicious/certs/keystore.p12
            storePassword:
              password: changeit
            storeType: PKCS12
    logNetwork: false
    logFrames: false
